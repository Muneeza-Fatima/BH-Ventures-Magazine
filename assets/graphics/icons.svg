<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
<!-- ============================================================
     Ten venture icons. One 24x24 grid, one stroke weight, no
     fills, no rounded-corner flourishes on some and not others.
     Mixed stroke weights across an icon set is the single
     loudest amateur tell, so every path here is stroke-width 1.5
     and the stroke is set once, in components.css.
     ============================================================ -->

  <!-- 01 New Automobile Trading (Export) — a vehicle on a deck, moving off the edge -->
  <symbol id="i-auto" viewBox="0 0 24 24">
    <path d="M3 14.5h18"/>
    <path d="M5 14.5v-2.2l2-3.6a1.4 1.4 0 0 1 1.2-.7h7.6a1.4 1.4 0 0 1 1.2.7l2 3.6v2.2"/>
    <circle cx="8" cy="16.6" r="1.6"/>
    <circle cx="16" cy="16.6" r="1.6"/>
    <path d="M7.4 11.4h9.2"/>
    <path d="M3 19.5h13"/>
    <path d="M18 19.5h3"/>
  </symbol>

  <!-- 02 Foodstuff Trading — stacked crates crossing a border line -->
  <symbol id="i-food" viewBox="0 0 24 24">
    <rect x="3.5" y="12" width="7.5" height="7"/>
    <rect x="13" y="12" width="7.5" height="7"/>
    <rect x="8.25" y="5" width="7.5" height="7"/>
    <path d="M7.25 12v7"/>
    <path d="M16.75 12v7"/>
    <path d="M12 5v7"/>
  </symbol>

  <!-- 03 Web3 Venture Studio — a block in a chain, one node still open -->
  <symbol id="i-web3" viewBox="0 0 24 24">
    <path d="M12 3.2 19 7v10l-7 3.8L5 17V7Z"/>
    <path d="M12 3.2V12l7-5"/>
    <path d="M12 12 5 7"/>
    <path d="M12 12v8.8"/>
  </symbol>

  <!-- 04 Digital Analytics Services — scattered data resolving into a trend -->
  <symbol id="i-analytics" viewBox="0 0 24 24">
    <path d="M3.5 20.5h17"/>
    <path d="M6 20.5v-5.5"/>
    <path d="M10.5 20.5v-9"/>
    <path d="M15 20.5v-4"/>
    <path d="M19.5 20.5v-12"/>
    <path d="M4.5 10.5 9 6l3.5 3.5L20 3"/>
    <circle cx="9" cy="6" r="1"/>
  </symbol>

  <!-- 05 Marketing via Social Media — one signal reaching a network -->
  <symbol id="i-social" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="2.4"/>
    <circle cx="5" cy="6" r="1.8"/>
    <circle cx="19" cy="6" r="1.8"/>
    <circle cx="5" cy="18" r="1.8"/>
    <circle cx="19" cy="18" r="1.8"/>
    <path d="M10.3 10.3 6.4 7.2"/>
    <path d="M13.7 10.3l3.9-3.1"/>
    <path d="M10.3 13.7 6.4 16.8"/>
    <path d="M13.7 13.7l3.9 3.1"/>
  </symbol>

  <!-- 06 Advertising — a campaign broadcast, measured in reach -->
  <symbol id="i-ads" viewBox="0 0 24 24">
    <path d="M4 9.5v5a1 1 0 0 0 1 1h3l6 4V4.5l-6 4H5a1 1 0 0 0-1 1Z"/>
    <path d="M8 15.5v4"/>
    <path d="M17.5 8.5a5 5 0 0 1 0 7"/>
    <path d="M20 6a8.5 8.5 0 0 1 0 12"/>
  </symbol>

  <!-- 07 Marketing Management — work moving across stages, end to end -->
  <symbol id="i-manage" viewBox="0 0 24 24">
    <rect x="3.5" y="4.5" width="5" height="15"/>
    <rect x="9.5" y="4.5" width="5" height="15"/>
    <rect x="15.5" y="4.5" width="5" height="15"/>
    <path d="M3.5 9h5"/>
    <path d="M9.5 12.5h5"/>
    <path d="M15.5 16h5"/>
  </symbol>

  <!-- 08 AI Research & Consultancies — a core with its connections out -->
  <symbol id="i-ai" viewBox="0 0 24 24">
    <rect x="8.5" y="8.5" width="7" height="7"/>
    <path d="M12 3.5v5"/>
    <path d="M12 15.5v5"/>
    <path d="M3.5 12h5"/>
    <path d="M15.5 12h5"/>
    <path d="M6.2 6.2 8.5 8.5"/>
    <path d="M15.5 15.5l2.3 2.3"/>
    <path d="M17.8 6.2 15.5 8.5"/>
    <path d="M8.5 15.5 6.2 17.8"/>
  </symbol>

  <!-- 09 Surveying & Evaluating — ground truth taken before anything moves -->
  <symbol id="i-survey" viewBox="0 0 24 24">
    <circle cx="12" cy="9" r="4.5"/>
    <path d="M12 4.5v9"/>
    <path d="M7.5 9h9"/>
    <path d="M12 13.5 8 20.5"/>
    <path d="M12 13.5 16 20.5"/>
    <path d="M9.4 18h5.2"/>
  </symbol>

  <!-- 10 Exhibition Organizing — a stand, built for the moment it opens -->
  <symbol id="i-expo" viewBox="0 0 24 24">
    <path d="M3 8.5h18"/>
    <path d="M3 8.5 5 4.5h14l2 4"/>
    <path d="M5 8.5v11"/>
    <path d="M19 8.5v11"/>
    <path d="M5 19.5h14"/>
    <path d="M9 19.5v-6h6v6"/>
  </symbol>
</svg>
