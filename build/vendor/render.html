<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;padding:0;background:#fff}canvas{display:block}</style>
</head>
<body>
<!-- Loading the worker script on the main thread makes pdf.js use its
     "fake worker", which runs under Chrome's virtual-time clock. A real
     Web Worker does not, and the screenshot then captures a blank page. -->
<script src="pdf.worker.min.js"></script>
<script src="pdf.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
const page = parseInt(q.get('page') || '1', 10);
const scale = parseFloat(q.get('scale') || '1.25');
(async () => {
  const pdf = await pdfjsLib.getDocument({ url: q.get('pdf') }).promise;
  const p = await pdf.getPage(page);
  const vp = p.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  document.body.appendChild(c);
  await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  document.title = 'done';
})();
</script>
</body>
</html>
